# CI (task A1): swift test across all core packages + proxy tests on every push.
name: CI
on:
  push:
  pull_request:

jobs:
  swift-core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: swift test (all seven modules)
        run: swift test --package-path app/Packages/InkboundCore

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: npm ci + test
        working-directory: app/proxy
        run: |
          npm ci
          npm test
