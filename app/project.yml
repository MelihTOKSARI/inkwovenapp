# XcodeGen spec (task A1). Regenerate after changing: xcodegen generate
name: Inkwoven
options:
  bundleIdPrefix: com.empath
  deploymentTarget:
    iOS: "17.0"
packages:
  InkwovenCore:
    path: Packages/InkwovenCore
targets:
  Inkwoven:
    type: application
    platform: iOS
    sources:
      # PrivacyInfo.xcprivacy is excluded from the glob and re-added explicitly
      # so it lands in the resources build phase — it must be copied into the
      # bundle root, not compiled, or App Store Connect rejects with ITMS-91053.
      - path: App
        excludes:
          - PrivacyInfo.xcprivacy
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: InkwovenCore
        products: [InkCore, InkData, InkNet, InkRender, InkMoney, InkSafety, InkAnalytics]
    # App Attest (audit T3). Without this entitlement `attestKey` fails on
    # every device, so the proxy can never mint a real identity and every
    # caller stays on the anonymous fallback — which `appattest` mode rejects.
    # Generated by xcodegen for the same reason signing is: set by hand in
    # Xcode, the next `xcodegen generate` reverts it.
    #
    # `production` is the value the App Store and TestFlight require. Xcode
    # builds onto a device attest against Apple's production servers too; if a
    # dev build ever needs the development environment, change it here — never
    # in Xcode — and change it back before archiving.
    entitlements:
      path: App/Inkwoven.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
    info:
      path: App/Info.plist
      properties:
        # Explicit, because XcodeGen otherwise re-emits its own literal "1.0"/"1"
        # defaults on regeneration and silently undoes the build-setting indirection.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Cold start paints the candlelit room's tone instead of a bare white
        # system sheet (the color set lives in Assets.xcassets).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Face ID keeps your notebook — and the Keeper's pages — private."
        # CrisisView asks canOpenURL(tel:/sms:) so a Wi-Fi-only iPad falls back
        # to the web line instead of a card that silently does nothing;
        # undeclared schemes make canOpenURL answer false everywhere.
        LSApplicationQueriesSchemes:
          - tel
          - sms
        # Only faces the app actually asks for (audit L-37): every name here
        # is referenced by PostScript name in InkFont, a Book's hand, or the
        # Riddle-diary line. The unused weights were removed with their files.
        UIAppFonts:
          - CormorantGaramond-500Italic.ttf
          - CormorantGaramond-600.ttf
          - EBGaramond-400.ttf
          - EBGaramond-400Italic.ttf
          - EBGaramond-500.ttf
          - EBGaramond-600.ttf
          - Tangerine-400.ttf
          - Tangerine-700.ttf
          - Caveat-400.ttf
          - Fondamento-400.ttf
          - PinyonScript-400.ttf
          - HomemadeApple-400.ttf
          - HerrVonMuellerhoff-400.ttf
          - PetitFormalScript-400.ttf
          - KaushanScript-400.ttf
        # SHA-256 (InkCore/Snapshot.swift) and HTTPS via the standard OS stack
        # are both exempt, so this is `false`. Declaring it here stops every
        # TestFlight upload from stalling on the manual export-compliance prompt.
        # Re-check if custom crypto is ever added.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.empath.inkwoven
        # Signing lives here, not in Xcode's UI, for the same reason as the
        # version numbers below: the next `xcodegen generate` reverts anything
        # set by hand, and an archive with no team cannot upload.
        DEVELOPMENT_TEAM: 77G7KM4549
        CODE_SIGN_STYLE: Automatic
        # Single source of truth for release metadata. Info.plist references
        # these via $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION); bumping the
        # number in Xcode's UI instead gets reverted by the next `xcodegen
        # generate` and the upload is rejected for a non-increasing build number.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPad-only for v1 (audit H-8): the app has zero compact-size-class
        # adaptation — epic I is explicitly unbuilt — and an iPhone install
        # would receive the iPad layout squeezed onto a phone. Reversible when
        # epic I lands: return this to "1,2" here AND in project.pbxproj.
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: false
        SWIFT_VERSION: "6.0"
    scheme:
      testTargets: [InkwovenTests, InkwovenUITests]
      # Local StoreKit catalog mirroring the App Store Connect products, so
      # purchase/restore/trial flows are exercisable in the simulator before
      # the ASC records exist. Release builds ignore it.
      storeKitConfiguration: Inkwoven.storekit
  InkwovenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Inkwoven
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.empath.inkwoven.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
  InkwovenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Inkwoven
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.empath.inkwoven.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
